<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英语选择填空 · 章节刷题</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #eef2f7; min-height: 100vh; color: #1e293b; padding-bottom: 40px;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 16px; }
  .card {
    background: #fff; border-radius: 18px; padding: 24px 20px;
    box-shadow: 0 6px 24px rgba(15, 23, 42, .08); margin-top: 14px;
  }
  .center { text-align: center; }
  h1 { font-size: 24px; margin-bottom: 6px; }
  h2 { font-size: 22px; }
  h3.sech { margin: 22px 4px 4px; font-size: 18px; }
  .muted { color: #64748b; font-size: 14px; margin: 6px 0 12px; }

  .topbar { display: flex; gap: 12px; align-items: center; padding: 2px 4px; }
  .stat { font-size: 14px; color: #475569; }
  .stat b { font-size: 16px; }
  .okc { color: #16a34a; font-weight: 700; }
  .badc { color: #dc2626; font-weight: 700; }
  .bar { height: 8px; background: #e2e8f0; border-radius: 99px; overflow: hidden; margin: 8px 0 0; }
  .bar i { display: block; height: 100%; background: #2563eb; border-radius: 99px; transition: width .3s; }

  .chip {
    display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 99px;
    background: #f1f5f9; color: #475569; margin: 0 6px 6px 0;
  }
  .chip.chp { background: #dcfce7; color: #15803d; }
  .chip.tagp { background: #ffedd5; color: #c2410c; }
  .stem { font-size: 20px; font-weight: 600; line-height: 1.7; margin: 10px 0 16px; }

  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    padding: 13px 14px; border: 2px solid #e2e8f0; border-radius: 12px;
    background: #fff; font-size: 17px; cursor: pointer; transition: all .15s;
    font-family: inherit; color: inherit;
  }
  .opt:hover { border-color: #2563eb; background: #eff6ff; }
  .opt .lt {
    width: 30px; height: 30px; border-radius: 50%; background: #e2e8f0;
    display: flex; align-items: center; justify-content: center; font-weight: 700; flex: none;
  }
  .opt:hover .lt { background: #bfdbfe; }

  button.primary {
    background: #2563eb; color: #fff; border: none; border-radius: 12px;
    padding: 13px 22px; font-size: 17px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  button.primary:hover { background: #1d4ed8; }
  button.big { width: 100%; padding: 16px; font-size: 19px; margin-top: 16px; }
  button.warn {
    background: #f97316; color: #fff; border: none; border-radius: 12px;
    padding: 13px 22px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  button.warn:hover { background: #ea580c; }
  button.ghost {
    background: none; border: none; color: #64748b; font-size: 14px;
    cursor: pointer; margin-top: 16px; text-decoration: underline; font-family: inherit;
  }
  .btnrow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .rules { text-align: left; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px 16px; margin: 14px 0; }
  .rules p { font-size: 14px; line-height: 1.9; color: #334155; }
  .chlist { text-align: left; margin: 8px 0 4px; }
  .chrow {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 12px; border-bottom: 1px dashed #e2e8f0; font-size: 14px;
  }
  .chrow:last-child { border-bottom: none; }
  .chrow b { color: #2563eb; }

  .intro { text-align: center; padding: 44px 20px; }
  .chnum { font-size: 15px; color: #16a34a; font-weight: 700; letter-spacing: 4px; margin-bottom: 8px; }
  .intro .primary { margin-top: 22px; }

  /* ===== 浮动答案层 ===== */
  .overlay {
    position: fixed; inset: 0; background: rgba(15, 23, 42, .62);
    display: flex; align-items: center; justify-content: center; z-index: 99; padding: 16px;
  }
  .ocard {
    background: #fff; border-radius: 20px; width: min(94vw, 560px);
    padding: 26px 22px 22px; text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .35); animation: pop .25s ease;
    border-top: 10px solid #94a3b8; max-height: 92vh; overflow-y: auto;
  }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } }
  .ocard.ok   { border-top-color: #16a34a; }
  .ocard.bad  { border-top-color: #dc2626; }
  .ocard.peek { border-top-color: #2563eb; }
  .ohead { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
  .ohead.ok   { color: #16a34a; }
  .ohead.bad  { color: #dc2626; }
  .ohead.peek { color: #2563eb; }
  .yourans { font-size: 17px; color: #64748b; margin: 6px 0 2px; }
  .yourans s { color: #dc2626; font-weight: 600; }
  .anslabel { font-size: 14px; color: #94a3b8; letter-spacing: 6px; margin-top: 8px; }
  .ansbig { display: flex; align-items: baseline; justify-content: center; margin: 2px 0 8px; }
  .ansbig .letter {
    font-size: clamp(4.2rem, 20vw, 6.8rem); font-weight: 900; line-height: 1.1;
  }
  .ansbig .text { font-size: clamp(1.7rem, 7.5vw, 2.5rem); font-weight: 800; }
  .ok .ansbig .letter, .ok .ansbig .text { color: #16a34a; }
  .bad .ansbig .letter, .bad .ansbig .text { color: #dc2626; }
  .peek .ansbig .letter, .peek .ansbig .text { color: #2563eb; }
  .exp {
    background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px;
    padding: 12px 14px; font-size: 15px; line-height: 1.8; color: #334155; text-align: left;
  }
  .nextbtn {
    width: 100%; margin-top: 16px; padding: 15px; font-size: 18px; font-weight: 800;
    border: none; border-radius: 12px; background: #e2e8f0; color: #94a3b8;
    cursor: not-allowed; font-family: inherit;
  }
  .nextbtn.ready { background: #16a34a; color: #fff; cursor: pointer; }
  .nextbtn.ready:hover { background: #15803d; }

  /* ===== 成绩与错题本 ===== */
  .score { margin: 10px 0 4px; }
  .score .big { font-size: 68px; font-weight: 900; color: #2563eb; }
  .score .slash { font-size: 26px; color: #94a3b8; font-weight: 700; }
  .wcard { text-align: left; }
  .wcard .stem { font-size: 17px; margin: 8px 0 12px; }
  .yourans2 { font-size: 15px; color: #64748b; margin-bottom: 4px; }
  .yourans2 s { color: #dc2626; font-weight: 600; }
  .ansbig.sm .letter { font-size: clamp(2.4rem, 10vw, 3.4rem); }
  .ansbig.sm .text { font-size: clamp(1.2rem, 5vw, 1.6rem); }
  .wcard .exp { margin-top: 10px; font-size: 14px; }
</style>
</head>
<body>
  <div id="app"></div>

  <script>
    // ========== 可调参数 ==========
    var WAIT_OK = 3;   // 答对后强制停留秒数
    var WAIT_BAD = 6;  // 答错 / 直接看答案后强制停留秒数

    var LETTERS = ["A", "B", "C", "D"];

    var CHAPTERS = [
      { name: "非谓语动词（不定式与动名词）" },
      { name: "介词" },
      { name: "不定代词" },
      { name: "形容词与副词" },
      { name: "动词时态与主谓一致" },
      { name: "情态动词" },
      { name: "情景交际" },
      { name: "名词（可数与不可数）" }
    ];

    var QUESTIONS = [
      { ch: 1, tag: "不定式 to do", src: "原卷 A", stem: "Nice ___ you again.",
        opts: ["see", "to see", "seeing", "to seeing"], ans: 1,
        exp: "nice / glad / happy 后面接不定式 to do：「很高兴再次见到你」就是 Nice to see you again." },
      { ch: 1, tag: "go + 动名词", src: "原卷 B", stem: "Let's go ___ this afternoon.",
        opts: ["swim", "swimming", "to swim", "swims"], ans: 1,
        exp: "go swimming 去游泳是固定搭配，同类的还有 go shopping、go fishing。" },
      { ch: 1, tag: "介词后接动名词", src: "新增 · F 题方向", stem: "Thank you for ___ our school.",
        opts: ["visiting", "is visiting", "visitor", "visits"], ans: 0,
        exp: "for 是介词，介词后面的动词要用动名词 doing。" },
      { ch: 2, tag: "时间介词", src: "原卷 C", stem: "Li Lei was born ___ the morning of June 1st.",
        opts: ["in", "on", "for", "at"], ans: 1,
        exp: "具体某一天的上午、下午、晚上用 on：on the morning of June 1st。" },
      { ch: 2, tag: "时间介词", src: "新增", stem: "We have four classes ___ the morning.",
        opts: ["in", "on", "for", "at"], ans: 0,
        exp: "泛指在早上、下午、晚上用 in the morning。" },
      { ch: 2, tag: "时间介词", src: "新增", stem: "He usually gets up ___ six thirty.",
        opts: ["in", "on", "for", "at"], ans: 3,
        exp: "具体到几点几分用 at。" },
      { ch: 2, tag: "时间介词", src: "新增", stem: "What do you usually have ___ breakfast?",
        opts: ["in", "on", "for", "at"], ans: 2,
        exp: "三餐前面用 for：have eggs for breakfast。" },
      { ch: 2, tag: "地点介词", src: "新增", stem: "There are many apples ___ the tree.",
        opts: ["in", "on", "under", "at"], ans: 1,
        exp: "树上长的果实用 on the tree。" },
      { ch: 2, tag: "地点介词", src: "新增", stem: "Look! Two birds are singing ___ the tree.",
        opts: ["in", "on", "under", "at"], ans: 0,
        exp: "外来的东西落在树上用 in the tree。长在树上用 on、外来在树上用 in，是一对经典对比考点。" },
      { ch: 3, tag: "some / any", src: "原卷 D", stem: "There aren't ___ apples on the table.",
        opts: ["a", "the", "much", "any"], ans: 3,
        exp: "否定句和疑问句里用 any；much 只能修饰不可数名词，apples 是复数可数名词。" },
      { ch: 3, tag: "-body 不定代词", src: "原卷 G", stem: "The room is empty. ___ is in it.",
        opts: ["Somebody", "Anybody", "Nobody", "Few people"], ans: 2,
        exp: "房间是空的，说明「没有人在里面」；few people 后面要接复数动词 are。" },
      { ch: 4, tag: "such / so", src: "原卷 E", stem: "It's ___ a fine day today. Let's go out for a walk.",
        opts: ["such", "so", "very", "quite"], ans: 0,
        exp: "such + a/an + 形容词 + 名词（such a fine day）；so / very / quite 只能直接修饰形容词（so fine）。" },
      { ch: 5, tag: "一般现在时三单", src: "原卷 F", stem: "My uncle ___ us every year.",
        opts: ["visiting", "is visiting", "visitor", "visits"], ans: 3,
        exp: "every year 提示一般现在时，uncle 是第三人称单数，动词加 s。" },
      { ch: 5, tag: "现在进行时", src: "新增", stem: "Look! Tom's father ___ the factory now.",
        opts: ["visiting", "is visiting", "visitor", "visits"], ans: 1,
        exp: "Look / now 提示动作正在进行，用现在进行时 is doing。如果题目是 Tom with his parents ___ the factory now，答案还是 is，因为 with 连接的人不算主语（就前原则）。" },
      { ch: 6, tag: "must 表推测", src: "原卷 H", stem: "The light in his room is on. He ___ be at home.",
        opts: ["may", "must", "can", "need"], ans: 1,
        exp: "灯还亮着，说明他「一定」在家：must 表示有把握的肯定推测。" },
      { ch: 6, tag: "may 请求许可", src: "新增", stem: "___ I come in? —Come in, please.",
        opts: ["may", "must", "can", "need"], ans: 0,
        exp: "请求许可的标准句型是 May I ...?" },
      { ch: 6, tag: "can 表能力", src: "新增", stem: "___ you play the piano? —No, I can't.",
        opts: ["may", "must", "can", "need"], ans: 2,
        exp: "答语是 can't，说明问的是能力，用 Can you ...?" },
      { ch: 6, tag: "needn't / mustn't", src: "新增", stem: "—Must I finish the work now? —No, you ___.",
        opts: ["needn't", "mustn't", "can't", "don't"], ans: 0,
        exp: "Must I ...? 的否定回答用 needn't（不必）；mustn't 的意思是「千万别、禁止」，不是「不必」，这是最容易错的地方。" },
      { ch: 7, tag: "情景应答", src: "原卷 I", stem: "—Mary, please answer the phone. —___, Mum.",
        opts: ["You'll help me", "I'm going", "I'm coming", "I'm leaving"], ans: 2,
        exp: "「我马上就来」固定说 I'm coming：朝说话人过来的方向用 come 不用 go。" },
      { ch: 8, tag: "不可数名词", src: "原卷 J", stem: "I want two ___.",
        opts: ["bottle of milk", "bottles of milks", "bottles of milk", "bottle of milks"], ans: 2,
        exp: "milk 是不可数名词，任何时候都不加 s；bottle 是可数名词，two 后面用复数。结构：数词 + 复数容器 + of + 不可数名词。" },
      { ch: 8, tag: "可数名词", src: "新增 · F 题方向", stem: "Mr. Wang is a ___ from England.",
        opts: ["visiting", "is visiting", "visitor", "visits"], ans: 2,
        exp: "a 后面要接可数名词单数，visitor（参观者）是名词，其他三项都是动词形式。这题考的是名词，所以放在名词章节。" }
    ];

    // ========== 状态 ==========
    var queue = [], pos = 0, results = {}, answered = false, pickedIdx = null, cdTimer = null;

    function app() { return document.getElementById("app"); }

    function chipsHTML(qi) {
      var q = QUESTIONS[qi];
      var ch = CHAPTERS[q.ch - 1];
      return '<span class="chip chp">第' + q.ch + '章 · ' + ch.name + '</span>' +
             '<span class="chip tagp">考点：' + q.tag + '</span>' +
             '<span class="chip">' + q.src + '</span>';
    }

    // ========== 开始页 ==========
    function showStart() {
      var rows = CHAPTERS.map(function (c, i) {
        var n = QUESTIONS.filter(function (q) { return q.ch === i + 1; }).length;
        return '<div class="chrow"><span>第' + (i + 1) + '章 ' + c.name + '</span><b>' + n + ' 题</b></div>';
      }).join("");
      app().innerHTML =
        '<div class="wrap"><div class="card center">' +
          '<h1>英语选择填空 · 章节刷题</h1>' +
          '<p class="muted">共 ' + QUESTIONS.length + ' 题 · ' + CHAPTERS.length + ' 个章节</p>' +
          '<div class="rules">' +
            '<p>① 每题先自己作答，不会做可点「直接看答案」；</p>' +
            '<p>② 答案用<b>大字浮层</b>显示：答对停留 ' + WAIT_OK + ' 秒、答错停留 ' + WAIT_BAD + ' 秒后，「下一题」按钮才会亮起；</p>' +
            '<p>③ 浮层没有关闭按钮，页面也没有其他翻题入口 —— <b>必须看完答案才能进下一题</b>；</p>' +
            '<p>④ 做完出成绩和错题本，可以只重做错题。</p>' +
          '</div>' +
          '<div class="chlist">' + rows + '</div>' +
          '<button class="primary big" onclick="startAll()">开始刷题 ▶</button>' +
        '</div></div>';
    }

    // ========== 章节过渡页 ==========
    function showIntro() {
      var qi = queue[pos], q = QUESTIONS[qi], ch = CHAPTERS[q.ch - 1];
      var n = queue.slice(pos).filter(function (i) { return QUESTIONS[i].ch === q.ch; }).length;
      app().innerHTML =
        '<div class="wrap"><div class="card intro">' +
          '<div class="chnum">第 ' + q.ch + ' 章</div>' +
          '<h2>' + ch.name + '</h2>' +
          '<p class="muted">本章共 ' + n + ' 题 · 先自己作答，再看大字答案</p>' +
          '<button class="primary" onclick="showQuestion()">开始本章 ▶</button>' +
        '</div></div>';
    }

    // ========== 题目页 ==========
    function showQuestion() {
      answered = false; pickedIdx = null;
      var qi = queue[pos], q = QUESTIONS[qi];
      var correct = queue.slice(0, pos).filter(function (i) { return results[i] && results[i].ok; }).length;
      var wrong = pos - correct;
      var pct = Math.round(pos / queue.length * 100);
      var optsHTML = q.opts.map(function (o, i) {
        return '<button class="opt" onclick="pick(' + i + ')"><span class="lt">' + LETTERS[i] + '</span><span>' + o + '</span></button>';
      }).join("");
      app().innerHTML =
        '<div class="wrap qscreen">' +
          '<div class="topbar">' +
            '<div class="stat">第 <b>' + (pos + 1) + '</b> / ' + queue.length + ' 题</div>' +
            '<div class="stat okc">✓ ' + correct + '</div>' +
            '<div class="stat badc">✗ ' + wrong + '</div>' +
          '</div>' +
          '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
          '<div class="card">' +
            '<div class="chips">' + chipsHTML(qi) + '</div>' +
            '<div class="stem">' + q.stem + '</div>' +
            '<div class="opts">' + optsHTML + '</div>' +
            '<button class="ghost" onclick="peek()">不会做？直接看答案 →</button>' +
          '</div>' +
        '</div>';
    }

    // ========== 作答 / 看答案 ==========
    function pick(i) {
      if (answered) return;
      answered = true; pickedIdx = i;
      var qi = queue[pos];
      var ok = (i === QUESTIONS[qi].ans);
      results[qi] = { p: i, ok: ok };
      openOverlay(ok ? "ok" : "bad");
    }

    function peek() {
      if (answered) return;
      answered = true; pickedIdx = null;
      results[queue[pos]] = { p: null, ok: false };
      openOverlay("peek");
    }

    // ========== 浮动大字答案层 ==========
    function openOverlay(mode) {
      var qi = queue[pos], q = QUESTIONS[qi];
      var isLast = (pos === queue.length - 1);
      var letter = LETTERS[q.ans], text = q.opts[q.ans];
      var head = "", extra = "";
      if (mode === "ok") {
        head = '<div class="ohead ok">回答正确 ✓</div>';
      } else if (mode === "bad") {
        head = '<div class="ohead bad">回答错误 ✗</div>';
        extra = '<div class="yourans">你的答案：<s>' + LETTERS[pickedIdx] + '. ' + q.opts[pickedIdx] + '</s></div>';
      } else {
        head = '<div class="ohead peek">正确答案</div>';
      }
      var wait = (mode === "ok") ? WAIT_OK : WAIT_BAD;

      var div = document.createElement("div");
      div.className = "overlay";
      div.innerHTML =
        '<div class="ocard ' + mode + '">' +
          head + extra +
          '<div class="anslabel">正 确 答 案</div>' +
          '<div class="ansbig"><span class="letter">' + letter + '</span><span class="text">. ' + text + '</span></div>' +
          '<div class="exp">💡 解析：' + q.exp + '</div>' +
          '<button id="nextBtn" class="nextbtn" disabled onclick="nextQ()">⏳ ' + wait + ' 秒后可继续</button>' +
        '</div>';
      document.body.appendChild(div);

      var left = wait;
      cdTimer = setInterval(function () {
        left--;
        var b = document.getElementById("nextBtn");
        if (!b) { clearInterval(cdTimer); return; }
        if (left > 0) {
          b.textContent = "⏳ " + left + " 秒后可继续";
        } else {
          clearInterval(cdTimer); cdTimer = null;
          b.disabled = false; b.classList.add("ready");
          b.textContent = isLast ? "查看成绩 ▶" : "下一题 ▶";
        }
      }, 1000);
    }

    function nextQ() {
      var b = document.getElementById("nextBtn");
      if (b && b.disabled) return;
      if (cdTimer) { clearInterval(cdTimer); cdTimer = null; }
      var ov = document.querySelector(".overlay");
      if (ov) ov.remove();
      pos++;
      if (pos >= queue.length) { showSummary(); return; }
      var prevCh = QUESTIONS[queue[pos - 1]].ch;
      var curCh = QUESTIONS[queue[pos]].ch;
      if (prevCh !== curCh) { showIntro(); } else { showQuestion(); }
    }

    // ========== 成绩 + 错题本 ==========
    function showSummary() {
      var total = queue.length;
      var wrongList = queue.filter(function (i) { return !results[i] || !results[i].ok; });
      var correct = total - wrongList.length;
      var rate = total ? Math.round(correct / total * 100) : 0;

      var cards = wrongList.map(function (i) {
        var q = QUESTIONS[i], r = results[i];
        var your = (r && r.p !== null && r.p !== undefined)
          ? LETTERS[r.p] + ". " + q.opts[r.p]
          : "未作答";
        return '<div class="card wcard">' +
          '<div class="chips">' + chipsHTML(i) + '</div>' +
          '<div class="stem">' + q.stem + '</div>' +
          '<div class="yourans2">你的答案：<s>' + your + '</s></div>' +
          '<div class="ansbig sm"><span class="letter">' + LETTERS[q.ans] + '</span><span class="text">. ' + q.opts[q.ans] + '</span></div>' +
          '<div class="exp">💡 解析：' + q.exp + '</div>' +
        '</div>';
      }).join("");

      app().innerHTML =
        '<div class="wrap">' +
          '<div class="card center">' +
            '<h2>练习完成 🎉</h2>' +
            '<div class="score"><span class="big">' + correct + '</span><span class="slash"> / ' + total + '</span></div>' +
            '<p class="muted">正确率 ' + rate + '% · 错题 ' + wrongList.length + ' 题</p>' +
            '<div class="btnrow">' +
              (wrongList.length ? '<button class="warn" onclick="startWrong()">只重做错题（' + wrongList.length + '）</button>' : "") +
              '<button class="primary" onclick="startAll()">全部重做</button>' +
            '</div>' +
          '</div>' +
          (wrongList.length ? '<h3 class="sech">错题本（正确答案大字显示）</h3>' + cards : "") +
        '</div>';
    }

    // ========== 重做入口 ==========
    function startAll() {
      queue = QUESTIONS.map(function (_, i) { return i; });
      pos = 0; results = {};
      showIntro();
    }

    function startWrong() {
      queue = Object.keys(results).filter(function (k) { return !results[k].ok; }).map(Number);
      if (!queue.length) { showSummary(); return; }
      queue.forEach(function (i) { delete results[i]; });
      pos = 0;
      showIntro();
    }

    // ========== 键盘快捷键 ==========
    document.addEventListener("keydown", function (e) {
      var ov = document.querySelector(".overlay");
      if (ov) {
        if (e.key === "Enter" || e.key === " " || e.key === "ArrowRight") {
          var b = document.getElementById("nextBtn");
          if (b && !b.disabled) nextQ();
        }
        return;
      }
      if (document.querySelector(".qscreen")) {
        var map = { a: 0, b: 1, c: 2, d: 3, "1": 0, "2": 1, "3": 2, "4": 3 };
        var k = e.key.toLowerCase();
        if (k in map) pick(map[k]);
      }
    });

    showStart();
  </script>
</body>
</html>
